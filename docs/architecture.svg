<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-label="QueryAtlas architecture and LangGraph workflow">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#70958a"/></marker><style>text{font-family:Arial,sans-serif;fill:#24453b;font-size:15px}.title{font-size:26px;font-weight:bold}.label{font-size:12px;fill:#60796e}.box{fill:#fff;stroke:#bbd6ca;stroke-width:1.5}.node{fill:#eaf5ef;stroke:#9bc4b3;stroke-width:1.5}.arrow{fill:none;stroke:#70958a;stroke-width:1.5;marker-end:url(#a)}</style></defs>
<rect width="1180" height="800" fill="#f7faf7"/><text x="45" y="50" class="title">QueryAtlas · schema-bound SQL assistant</text><text x="45" y="78" class="label">React + FastAPI + a real LangGraph workflow + immutable SQLite</text>
<rect x="45" y="115" width="290" height="100" rx="12" class="box"/><text x="65" y="147">Browser workspace</text><text x="65" y="173" class="label">Chat · SQL · results · explanation · plan</text><text x="65" y="194" class="label">Browser-local history / theme</text>
<rect x="405" y="115" width="300" height="100" rx="12" class="box"/><text x="425" y="147">FastAPI API boundary</text><text x="425" y="173" class="label">Typed request limits · server-only model config</text><text x="425" y="194" class="label">SSE progress + validated final response</text><path d="M335 165H405" class="arrow"/>
<rect x="790" y="115" width="340" height="100" rx="12" class="box"/><text x="810" y="147">Groq / explicit sample mode</text><text x="810" y="173" class="label">System policy + actual schema + bounded context</text><text x="810" y="194" class="label">Untrusted JSON proposal; no execution tools</text>
<rect x="45" y="265" width="1085" height="355" rx="16" fill="#f0f6f1" stroke="#c8ddd0"/><text x="65" y="296">Compiled LangGraph StateGraph · isolated per request</text>
<rect x="75" y="325" width="190" height="58" rx="8" class="node"/><text x="93" y="359">detect_intent</text><rect x="325" y="325" width="195" height="58" rx="8" class="node"/><text x="343" y="359">validate_scope</text><rect x="580" y="325" width="195" height="58" rx="8" class="node"/><text x="598" y="359">retrieve_schema</text><rect x="835" y="325" width="260" height="58" rx="8" class="node"/><text x="853" y="359">generate_sql / bounded repair</text><path d="M555 215V240H170V325M265 354H325M520 354H580M775 354H835M960 325V215" class="arrow"/>
<rect x="75" y="470" width="220" height="68" rx="8" class="node"/><text x="93" y="500">explain_sql → response</text><text x="93" y="521" class="label">No unvalidated candidate returned</text><rect x="345" y="470" width="205" height="68" rx="8" class="node"/><text x="363" y="500">execute_sql (optional)</text><text x="363" y="521" class="label">500 rows / 2 seconds / authorizer</text><rect x="600" y="470" width="205" height="68" rx="8" class="node"/><text x="618" y="500">optimize_sql</text><text x="618" y="521" class="label">Proven rewrites + real EXPLAIN</text><rect x="855" y="470" width="240" height="68" rx="8" class="node"/><text x="873" y="500">validate_sql</text><text x="873" y="521" class="label">AST · tables/columns · FK · compile</text><path d="M965 383V470M855 503H805M600 503H550M345 503H295" class="arrow"/><path d="M422 383V421H184V470" class="arrow"/><text x="224" y="414" class="label">refuse / clarify</text><path d="M703 538V573H184V538" class="arrow"/><text x="396" y="592" class="label">skip execution when auto-run is off</text><path d="M1080 470V420H1005V383" class="arrow"/><text x="925" y="442" class="label">at most one repair</text>
<rect x="345" y="670" width="595" height="85" rx="12" class="box"/><text x="368" y="702">Bundled sample.db · immutable, read-only SQLite</text><text x="368" y="729" class="label">6 business tables · 1,426 synthetic records · no runtime filesystem writes</text><path d="M448 538V670M703 620V670M975 538V712H940" class="arrow"/><text x="45" y="785" class="label">Output dialects: SQLite / PostgreSQL / MySQL. All sample execution and cost plans use SQLite.</text>
</svg>
